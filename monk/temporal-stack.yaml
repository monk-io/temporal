namespace: temporal

stack:
  defines: process-group
  metadata:
    name: Temporal standalone stack
    description: |
      Production-oriented standalone Temporal stack with PostgreSQL persistence,
      Elasticsearch visibility, Temporal server, and Temporal Web UI. Sensitive values
      are read from plain Monk secrets and must be set by inheriting deployments.
    tags: temporal, stack, production, postgres, elasticsearch
  runnable-list:
    - temporal/stack-postgres
    - temporal/stack-elasticsearch
    - temporal/stack-server
    - temporal/stack-ui

stack-local:
  defines: process-group
  metadata:
    name: Temporal standalone local stack
    description: Local-only standalone stack flavor for automated verification with UI published on localhost.
    tags: temporal, stack, local, postgres, elasticsearch
  runnable-list:
    - temporal/local-postgres
    - temporal/local-elasticsearch
    - temporal/local-server
    - temporal/local-ui

stack-postgres:
  defines: runnable
  inherits: postgresql/db-v17
  metadata:
    name: Temporal stack PostgreSQL
    description: PostgreSQL persistence database for secure standalone Temporal stack.
    tags: temporal, postgres, production
  variables:
    db_user:
      env: POSTGRES_USER
      type: string
      value: temporal
      description: PostgreSQL user for Temporal persistence.
    db_pass:
      env: POSTGRES_PASSWORD
      type: string
      value: <- secret("temporal-postgres-password")
      description: Sensitive PostgreSQL password read from temporal-postgres-password secret.
    db_name:
      env: POSTGRES_DB
      type: string
      value: temporal
      description: Initial PostgreSQL database name for Temporal persistence.
  services:
    postgres:
      description: Internal PostgreSQL service used by secure Temporal stack.
      container: postgres
      port: 5432
      protocol: tcp

stack-elasticsearch:
  defines: runnable
  inherits: elasticsearch/base
  metadata:
    name: Temporal stack Elasticsearch
    description: Elasticsearch visibility store for secure standalone Temporal stack.
    tags: temporal, elasticsearch, visibility, production
  variables:
    cluster-name:
      type: string
      value: temporal-stack-es
      description: Elasticsearch cluster name for secure Temporal stack.
      env: cluster.name
    security-enabled:
      type: bool
      value: true
      description: Enable Elasticsearch security for secure Temporal stack.
      env: xpack.security.enabled
    http-ssl-enabled:
      type: bool
      value: false
      description: Keep internal HTTP cleartext; secure deployments should place TLS at the private network or proxy layer.
      env: xpack.security.http.ssl.enabled
    elastic-password:
      type: string
      value: <- secret("temporal-es-password")
      description: Sensitive Elasticsearch bootstrap password read from temporal-es-password secret.
      env: ELASTIC_PASSWORD
    heap-size:
      type: string
      value: "1g"
      description: Elasticsearch JVM heap size for secure Temporal stack.
  services:
    http:
      description: Internal Elasticsearch HTTP service used by secure Temporal stack visibility.
      container: elasticsearch
      port: 9200
      protocol: tcp
    transport:
      description: Internal Elasticsearch transport service retained for node transport.
      container: elasticsearch
      port: 9300
      protocol: tcp

stack-server:
  defines: runnable
  inherits: temporal/base
  metadata:
    name: Temporal stack server
    description: Secure standalone Temporal server connected to stack PostgreSQL and Elasticsearch services.
    tags: temporal, server, production, postgres, elasticsearch
  connections:
    database:
      runnable: temporal/stack-postgres
      service: postgres
    elasticsearch:
      runnable: temporal/stack-elasticsearch
      service: http
  depends:
    wait-for:
      runnables:
        - temporal/stack-postgres
        - temporal/stack-elasticsearch
  variables:
    postgres_password:
      env: POSTGRES_PWD
      type: string
      value: <- secret("temporal-postgres-password")
      description: Sensitive PostgreSQL password read from temporal-postgres-password secret.
    postgres_seeds:
      env: POSTGRES_SEEDS
      type: string
      value: <- connection-hostname("database")
      description: PostgreSQL hostname supplied by Monk connection.
    enable_es:
      env: ENABLE_ES
      type: string
      value: "true"
      description: Enables Elasticsearch visibility for standalone Temporal stack.
    es_seeds:
      env: ES_SEEDS
      type: string
      value: <- connection-hostname("elasticsearch")
      description: Elasticsearch hostname supplied by Monk connection.
    es_user:
      env: ES_USER
      type: string
      value: elastic
      description: Elasticsearch username for secure Temporal stack.
    es_password:
      env: ES_PWD
      type: string
      value: <- secret("temporal-es-password")
      description: Sensitive Elasticsearch password read from temporal-es-password secret.
    es_version:
      env: ES_VERSION
      type: string
      value: v7
      description: Elasticsearch compatibility version used by Temporal visibility.

stack-ui:
  defines: runnable
  inherits: temporal/ui
  metadata:
    name: Temporal stack UI
    description: Temporal Web UI for secure standalone stack, exposed through production ingress only.
    tags: temporal, ui, production
  connections:
    temporal:
      runnable: temporal/stack-server
      service: frontend
  depends:
    wait-for:
      runnables:
        - temporal/stack-server
  variables:
    temporal_address:
      env: TEMPORAL_ADDRESS
      type: string
      value: <- connection-hostname("temporal") ":7233" concat-all
      description: Temporal frontend address built from Monk connection.
  services:
    http:
      description: Temporal Web UI HTTP service intended for production ingress.
      container: ui
      port: 8080
      protocol: tcp

local-postgres:
  defines: runnable
  inherits: temporal/stack-postgres
  metadata:
    name: Temporal local stack PostgreSQL
    description: Local-only PostgreSQL database for standalone stack verification.
    tags: temporal, postgres, local
  variables:
    db_pass:
      env: POSTGRES_PASSWORD
      type: string
      value: temporal-local-postgres
      description: Local-only PostgreSQL password for automated verification.

local-elasticsearch:
  defines: runnable
  inherits: temporal/stack-elasticsearch
  metadata:
    name: Temporal local stack Elasticsearch
    description: Local-only Elasticsearch visibility store for standalone stack verification.
    tags: temporal, elasticsearch, visibility, local
  variables:
    security-enabled:
      type: bool
      value: false
      description: Disable Elasticsearch security for local automated verification only.
      env: xpack.security.enabled
    elastic-password:
      type: string
      value: ""
      description: Sensitive Elasticsearch bootstrap password intentionally empty for local stack with security disabled.
      env: ELASTIC_PASSWORD
    heap-size:
      type: string
      value: "512m"
      description: Elasticsearch JVM heap size for local stack verification.

local-server:
  defines: runnable
  inherits: temporal/stack-server
  metadata:
    name: Temporal local stack server
    description: Local-only Temporal server connected to local stack PostgreSQL and Elasticsearch.
    tags: temporal, server, local, postgres, elasticsearch
  connections:
    database:
      runnable: temporal/local-postgres
      service: postgres
    elasticsearch:
      runnable: temporal/local-elasticsearch
      service: http
  depends:
    wait-for:
      runnables:
        - temporal/local-postgres
        - temporal/local-elasticsearch
  variables:
    postgres_password:
      env: POSTGRES_PWD
      type: string
      value: temporal-local-postgres
      description: Local-only PostgreSQL password matching local-postgres.
    es_user:
      env: ES_USER
      type: string
      value: ""
      description: Elasticsearch username intentionally empty for local stack with security disabled.
    es_password:
      env: ES_PWD
      type: string
      value: ""
      description: Sensitive Elasticsearch password intentionally empty for local stack with security disabled.

local-ui:
  defines: runnable
  inherits: temporal/stack-ui
  metadata:
    name: Temporal local stack UI
    description: Local-only Temporal UI published on localhost for external verification.
    tags: temporal, ui, local
  connections:
    temporal:
      runnable: temporal/local-server
      service: frontend
  depends:
    wait-for:
      runnables:
        - temporal/local-server
  variables:
    temporal_cors_origins:
      env: TEMPORAL_CORS_ORIGINS
      type: string
      value: http://localhost:18089
      description: Allowed browser origin for local stack UI access.
  services:
    http:
      description: Locally published Temporal Web UI HTTP service for standalone stack verification.
      container: ui
      port: 8080
      protocol: tcp
      host-port: 18089
